<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title data-i18n="optionsTitle">Settings</title>
<link rel="stylesheet" href="result.css">
<style>
  .wrap { max-width: 700px; }
  .row { display: flex; gap: 14px; align-items: flex-start; padding: 14px 0; border-bottom: 1px solid var(--line); }
  .row:last-of-type { border-bottom: 0; }
  .row__body { flex: 1; }
  .row__name { font-size: 14px; font-weight: 600; margin: 0 0 2px; }
  .row__note { font-size: 12.5px; color: var(--ink-soft); margin: 0; }
  .row__ctrl { flex: 0 0 auto; padding-top: 2px; }
  input[type="number"] { font: inherit; font-size: 13.5px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 6px; background: #fbfbfd; width: 84px; }
  input[type="checkbox"] { width: 18px; height: 18px; }
  .save { margin-top: 18px; display: flex; align-items: center; gap: 14px; }
</style>
</head>
<body>

<header class="bar"><div class="bar__title" data-i18n="optionsBar"></div></header>

<main class="wrap">
  <section class="panel">

    <div class="row">
      <div class="row__body">
        <p class="row__name" data-i18n="optPreScroll"></p>
        <p class="row__note" data-i18n="optPreScrollNote"></p>
      </div>
      <div class="row__ctrl"><input type="checkbox" id="preScroll"></div>
    </div>

    <div class="row">
      <div class="row__body">
        <p class="row__name" data-i18n="optHideFixed"></p>
        <p class="row__note" data-i18n="optHideFixedNote"></p>
      </div>
      <div class="row__ctrl"><input type="checkbox" id="hideFixed"></div>
    </div>

    <div class="row">
      <div class="row__body">
        <p class="row__name" data-i18n="optInterval"></p>
        <p class="row__note" data-i18n="optIntervalNote"></p>
      </div>
      <div class="row__ctrl"><input type="number" id="intervalMs" min="200" max="3000" step="50"> <span data-i18n="unitMs"></span></div>
    </div>

    <div class="save">
      <button class="btn btn--main" id="save" data-i18n="btnSave"></button>
      <button class="btn" id="reset" data-i18n="btnReset"></button>
      <span class="status" id="status"></span>
    </div>

  </section>

  <section class="panel">
    <p class="row__name" data-i18n="shortcutHead"></p>
    <p class="row__note" data-i18n="shortcutNote"></p>
  </section>
</main>

<script src="i18n.js"></script>
<script src="options.js"></script>
</body>
</html>
